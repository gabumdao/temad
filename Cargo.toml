[package]
name = "temad"
version = "0.1.0"
edition = "2021"
description = "A lightweight, highly efficient Dynamic Theme and Wallpaper Manager"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
